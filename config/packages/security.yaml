security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            custom_authenticator: App\Security\EmailAuthenticator
            
            logout:
                path: app_logout
                # Redirige vers la page de login après la déconnexion
                target: app_login

            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /

    # Contrôle d'accès : Définit qui a le droit de voir quoi
    access_control:
            #  Pages publiques (Connexion, Inscription, Mdp oublié)
            - { path: ^/connexion, roles: PUBLIC_ACCESS }
            - { path: ^/inscription, roles: PUBLIC_ACCESS } # 
            - { path: ^/verify/email, roles: PUBLIC_ACCESS } # <-- Pour la confirmation d'email
            - { path: ^/forgot-password, roles: PUBLIC_ACCESS }

            # Page d'accueil accessible à tous
            - { path: ^/$, roles: PUBLIC_ACCESS }

            # 2. Zone Admin
            - { path: ^/admin, roles: ROLE_ADMIN }

            # 3. Tout le reste du site nécessite d'être connecté
            - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10