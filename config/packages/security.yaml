security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    
    #indique que les users  proviennent de l'entit App\Entity\User et que seul l'@dress mail est reconnu pour la connexion id unique
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            custom_authenticator: App\Security\EmailAuthenticator
            
            logout:
                path: app_logout
                # Redirige vers la page de login après la déconnexion
                target: app_login

            # remenber me genere un cookies securisé pour garder le usr connecté pendant 7 jours
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /

    # Contrôle d'accès : Définit qui a le droit de voir quoi
    access_control:
            #  Pages publiques ^/nom (Connexion, Inscription, Mdp oublié)
            
            - { path: ^/connexion, roles: PUBLIC_ACCESS }
            - { path: ^/inscription, roles: PUBLIC_ACCESS } # 
            #  Pour la confirmation d'email
            - { path: ^/verify/email, roles: PUBLIC_ACCESS } 
            - { path: ^/reset-password, roles: PUBLIC_ACCESS }

            # ^/ (sans le $) signifie "tout ce qui commence par un slash"
            # Page d'accueil accessible à tous  (regex) ^/$=://mon site.com/
            - { path: ^/$, roles: PUBLIC_ACCESS }

            #  Accès Admin
            - { path: ^/admin, roles: ROLE_ADMIN }

            #  Tout le reste du site nécessite d'être connecté (toutes les pages du sites non definies)
            - { path: ^/, roles: ROLE_USER }

when@test:
    security:
    # hachage des mots de passes alfgoritm "auto" indique à symfony de securiser en argon2id ou bcrypt
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10